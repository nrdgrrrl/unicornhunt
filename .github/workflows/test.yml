name: Tests

on:
  push:
  pull_request:
    branches: [1-epic-sketchbook-rainbow-lsd]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      # Use the browser downloaded for the locked Playwright version in CI.
      - name: Browser tests
        run: |
          export PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH="$(node --input-type=module -e "import { chromium } from '@playwright/test'; process.stdout.write(chromium.executablePath())")"
          npm run test:browser
      - name: Upload screenshots, health results, and failure traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-verification
          path: |
            playwright-report/
            test-results/
          retention-days: 14
